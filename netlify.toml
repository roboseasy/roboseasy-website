[build]
  # sync-products는 CONTEXT=production에서만 실제 동기화 (그 외 컨텍스트는 스크립트가 스킵)
  command = "npm run sync-products && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  included_files = ["src/excel/**"]

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
